services:
  kafka:
    image: apache/kafka:4.0.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-topics.sh
        - --bootstrap-server
        - kafka:29092
        - --list
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.0.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic flight-observations --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic flight-observations-dlq --partitions 1 --replication-factor 1

  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: flighttracker
      POSTGRES_USER: flighttracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_gerekli}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flighttracker -d flighttracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  consumer:
    image: flighttracker-consumer:local
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args:
        PROJECT: FlightTracker.Consumer
    command: ["dotnet", "FlightTracker.Consumer.dll"]
    environment:
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topic: flight-observations
      Kafka__GroupId: flighttracker-postgres-consumer-v2
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=flighttracker;Username=flighttracker;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_gerekli}"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: flighttracker-api:local
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args:
        PROJECT: FlightTracker.Api
    command: ["dotnet", "FlightTracker.Api.dll"]
    ports:
      - "127.0.0.1:5050:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topic: flight-observations
      Kafka__GroupId: flighttracker-live-consumer
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=flighttracker;Username=flighttracker;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_gerekli}"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  producer:
    image: flighttracker-producer:local
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args:
        PROJECT: FlightTracker.Producer
    command: ["dotnet", "FlightTracker.Producer.dll"]
    environment:
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topic: flight-observations
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      consumer:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: flighttracker-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  kafka_data:
  postgres_data:
